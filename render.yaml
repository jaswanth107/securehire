# Render Blueprint — provisions the API service.
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repo.
#
# No database is declared here: Render allows a single free Postgres instance
# per account. Point DATABASE_URL at a Postgres of your own — a free Neon or
# Supabase project works, and unlike Render's free tier it does not expire
# after 30 days.
#
# Note that sharing an existing database is NOT a safe option here. The init
# migration is fully schema-qualified (`CREATE TABLE "public"."User"`), so a
# `?schema=` parameter in the URL cannot redirect it: the tables land in
# `public` regardless, alongside whatever already lives there. SecureHire
# needs its own database.
#
# Three values are deliberately NOT set here:
#   DATABASE_URL — connection string for that Postgres.
#   JWT_SECRET   — Render generates a strong random one on first deploy.
#   CORS_ORIGIN  — set it in the dashboard once the Vercel URL exists.

services:
  - type: web
    name: securehire-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev is required: NODE_ENV=production below applies to the build
    # too, and tsc/prisma live in devDependencies. Without it the build fails
    # with "tsc: not found".
    #
    # Migrations run at build time so a failed migration fails the deploy
    # instead of taking down a running instance.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Connection string for your own Postgres (Neon / Supabase / Render paid)
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and never shown in the repo. Rotating it
      # invalidates every issued session, which is the intended behaviour.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      # The cookie is issued over HTTPS in production, so it must be Secure.
      - key: COOKIE_SECURE
        value: "true"
      # Set to your Vercel URL in the dashboard, e.g. https://securehire.vercel.app
      - key: CORS_ORIGIN
        sync: false
